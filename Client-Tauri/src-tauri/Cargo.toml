[package]
name = "catrealm-tauri"
version = "1.9.2"
description = "CatRealm Sushi native desktop client"
edition = "2021"

[lib]
name = "catrealm_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
base64 = "0.22"
# Updater: parse the sushi.yml manifest version and verify the downloaded
# installer. sha2/semver are pure Rust (no C toolchain); the HTTP client is
# Windows-only (below) since desktop updates only ship an NSIS installer.
sha2 = "0.10"
semver = "1"
tauri-plugin-notification = "=2.3.0"

# Auto-grant WebView2 media permissions for the app origin (see
# src/webview_permissions.rs). Versions pinned to what wry already resolved so
# the ICoreWebView2* types match across the with_webview() boundary.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Graphics_Imaging",
    "Storage_Streams",
    "UI_Notifications",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }
# Updater HTTP client (Windows-only). native-tls => schannel, so no ring /
# aws-lc-rs / nasm build-tooling is pulled onto the build runners, and Linux
# never compiles a TLS stack for a feature it doesn't ship.
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

# Same idea on Linux: WebKitGTK denies unhandled permission requests, so grant
# mic/camera + device-info to the app origin. Version pinned to wry's resolved
# webkit2gtk so the WebView type matches across the with_webview() boundary.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
gdk = "=0.18.2"
gtk = "=0.18.2"
libc = "0.2"
# Native voice backend (src/native_voice.rs): distro WebKitGTK compiles WebRTC
# out entirely, so LiveKit voice runs through the Rust SDK in-process instead.
# rustls keeps system OpenSSL off the builder; libwebrtc arrives as LiveKit's
# prebuilt static archive via webrtc-sys' build script.
livekit = { version = "0.7", features = ["rustls-tls-native-roots"], optional = true }
nnnoiseless = { version = "=0.5.2", default-features = false }
jpeg-encoder = "=0.7.0"
futures-util = "0.3"

[features]
# native-voice only resolves to real code on Linux (the dependency lives under
# the linux target table); it stays a no-op flag elsewhere. Kept default-on so
# CI builds ship it, and detachable (--no-default-features) if the libwebrtc
# prebuilt ever breaks the self-hosted builder.
default = ["native-voice"]
native-voice = ["dep:livekit"]

# Default profile favors FAST builds: thin LTO parallelizes across cores and is
# within a hair of fat LTO at runtime — this is what dev-channel pushes and local
# builds use. CI overrides to fat LTO + a single codegen unit for the
# `latest`/stable channel via CARGO_PROFILE_RELEASE_* env vars (see the client
# build workflows), so shipped stable builds stay maximally optimized.
[profile.release]
lto = "thin"
codegen-units = 16
strip = true
